<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV Lot ID 更換 / 重新打包工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6a7385;--bd:#d9dde5;--ac:#2563eb;--acx:#fff;--warn:#b45309;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d2129;--tx:#e6e9ef;--mut:#98a1b3;--bd:#343b48;--ac:#5b8cff;--acx:#0b1020;--warn:#f0a94a;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Noto Sans TC",sans-serif}
h1{font-size:20px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
#drop{border:2px dashed var(--bd);border-radius:10px;padding:26px;text-align:center;color:var(--mut);cursor:pointer}
#drop.over{border-color:var(--ac);color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input[type=text]{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
button{padding:7px 14px;border:1px solid var(--ac);background:var(--ac);color:var(--acx);border-radius:6px;cursor:pointer;font:inherit}
button.sec{background:transparent;color:var(--ac)}
button:disabled{opacity:.45;cursor:not-allowed}
.tw{overflow-x:auto;max-height:55vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);z-index:1}
td input[type=text]{width:140px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.warn{color:var(--warn)}.ok{color:var(--ok)}
#sum span{display:inline-block;margin:2px 8px 2px 0;padding:2px 8px;border:1px solid var(--bd);border-radius:12px}
#log{color:var(--mut);font-size:12px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<h1>CSV Lot ID 更換 / 重新打包工具</h1>

<div class="card">
  <div id="drop">點擊選擇或拖曳多個 <b>.csv / .zip</b> 檔案到此（zip 會自動解開讀取其中的 csv）</div>
  <input id="fi" type="file" accept=".csv,.zip" multiple hidden>
  <div id="log"></div>
</div>

<div class="card" id="gcard" hidden>
  <b>依原 Lot ID 分別指定新值</b>
  <div style="color:var(--mut);font-size:12px;margin:2px 0 8px">每個原 Lot ID 可各自指定新 Lot ID 與新 Production ID，會套用到該 Lot 的所有檔案；留空代表不更改。</div>
  <div class="tw" style="max-height:none"><table>
    <thead><tr><th>原 Lot ID</th><th>檔案數</th><th>原 Production ID</th><th>新 Lot ID</th><th>新 Production ID</th></tr></thead>
    <tbody id="gb"></tbody>
  </table></div>
</div>

<div class="card" id="bulk" hidden>
  <div class="row">
    <label>新 Lot ID（含 Wafer ID 前 7 碼、檔名前 7 碼）<input type="text" id="bLot" placeholder="例如 RK30999" size="18"></label>
    <label>新 Production ID<input type="text" id="bProd" placeholder="留空 = 不更改" size="26"></label>
    <button id="apply">套用到勾選的檔案</button>
    <button class="sec" id="reset">還原全部</button>
  </div>
  <div style="margin-top:8px;color:var(--mut);font-size:12px">若要對勾選的檔案統一指定，或在下表逐檔微調，也可以使用此區。</div>
</div>

<div class="card" id="tcard" hidden>
  <div class="tw"><table>
    <thead><tr><th><input type="checkbox" id="all" checked></th><th>原檔名</th><th>原 Lot ID</th><th>原 Production ID</th><th>新 Lot ID</th><th>新 Production ID</th><th>新檔名</th></tr></thead>
    <tbody id="tb"></tbody>
  </table></div>
</div>

<div class="card" id="out" hidden>
  <div id="sum"></div>
  <div class="row" style="margin-top:10px">
    <button id="dlEach">每個 Lot ID 各下載一個 zip</button>
    <button class="sec" id="dlOne">全部合成單一 zip（內含各 Lot zip）</button>
  </div>
</div>

<script>
const files=[]; let uid=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const log=m=>$('log').textContent=m;

// bytes <-> binary string (保留原始位元組，避免亂碼檔案被破壞)
function b2s(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return s}
function s2b(s){const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u}

function getField(t,label){
  const m=t.slice(0,6000).match(new RegExp('^'+label+'[ \\t]*:[ \\t]*(.*)$','m'));
  return m?m[1].replace(/\s+$/,''):'';
}
function setField(t,label,fn){
  const re=new RegExp('^('+label+'[ \\t]*:[ \\t]*)(.*)$','m');
  return t.replace(re,(a,p,v)=>{const tr=v.match(/\s*$/)[0];return p+fn(v.replace(/\s+$/,''))+tr});
}

async function addCsv(name,u8){
  const text=b2s(u8);
  const base=name.split(/[\\/]/).pop();
  const lot=getField(text,'Lot ID'), wafer=getField(text,'Wafer ID'), prod=getField(text,'Production ID');
  files.push({id:uid++,name:base,text,lot,wafer,prod,newLot:lot,newProd:prod,sel:true,
    lot0:base.slice(0,7)});
}
async function ingest(list){
  let n=0;
  for(const f of list){
    const lower=f.name.toLowerCase();
    try{
      if(lower.endsWith('.zip')){
        const z=await JSZip.loadAsync(f);
        for(const e of Object.values(z.files)){
          if(e.dir||e.name.startsWith('__MACOSX')||!e.name.toLowerCase().endsWith('.csv'))continue;
          await addCsv(e.name,await e.async('uint8array'));n++;
        }
      }else if(lower.endsWith('.csv')){
        await addCsv(f.name,new Uint8Array(await f.arrayBuffer()));n++;
      }
    }catch(err){log('讀取失敗：'+f.name+' — '+err.message)}
  }
  log('已匯入 '+n+' 個 CSV，目前共 '+files.length+' 個');
  render();
}

const newName=f=>{const l=(f.newLot||f.lot0).trim();return l+f.name.slice(7)};
const gkey=f=>f.lot||f.lot0;
function render(){renderGroups();renderTable()}
function renderGroups(){
  const m=new Map();
  for(const f of files){const k=gkey(f);if(!m.has(k))m.set(k,[]);m.get(k).push(f)}
  const one=a=>{const u=[...new Set(a)];return u.length===1?u[0]:''};
  $('gb').innerHTML=[...m].map(([k,v])=>{
    const nl=one(v.map(f=>f.newLot)),np=one(v.map(f=>f.newProd));
    const ops=[...new Set(v.map(f=>f.prod))];
    return `<tr data-key="${esc(k)}"><td class="mono"><b>${esc(k)}</b></td><td>${v.length}</td>
    <td>${esc(ops.join(' / '))}</td>
    <td><input type="text" class="gl mono" value="${esc(nl)}" placeholder="${nl===''&&v.length?'（各檔不同）':''}"></td>
    <td><input type="text" class="gp" value="${esc(np)}" placeholder="${np===''&&v.length?'（各檔不同）':''}"></td></tr>`}).join('');
}
$('gb').addEventListener('input',e=>{
  const tr=e.target.closest('tr');if(!tr)return;
  const v=e.target.value.trim();
  files.filter(f=>gkey(f)===tr.dataset.key).forEach(f=>{
    if(e.target.classList.contains('gl'))f.newLot=v||f.lot;
    else f.newProd=e.target.value||f.prod;
  });
  renderTable();
});
function renderTable(){
  const has=files.length>0;
  ['gcard','bulk','tcard','out'].forEach(i=>$(i).hidden=!has);
  $('tb').innerHTML=files.map(f=>`<tr data-id="${f.id}">
    <td><input type="checkbox" class="sel" ${f.sel?'checked':''}></td>
    <td class="mono">${esc(f.name)}</td><td class="mono">${esc(f.lot)}</td><td>${esc(f.prod)}</td>
    <td><input type="text" class="nl mono" value="${esc(f.newLot)}"></td>
    <td><input type="text" class="np" value="${esc(f.newProd)}"></td>
    <td class="mono nn">${esc(newName(f))}</td></tr>`).join('');
  summary();
}
function summary(){
  const g=groups();
  $('sum').innerHTML='將產生 <b>'+g.size+'</b> 個 zip：'+[...g].map(([k,v])=>
    `<span>${esc(k)}.zip · ${v.length} 檔${k.length!==7?' <b class="warn">(長度≠7)</b>':''}</span>`).join('');
}
function groups(){
  const m=new Map();
  for(const f of files){const k=(f.newLot||f.lot0).trim();if(!m.has(k))m.set(k,[]);m.get(k).push(f)}
  return m;
}
$('tb').addEventListener('input',e=>{
  const tr=e.target.closest('tr');if(!tr)return;
  const f=files.find(x=>x.id==tr.dataset.id);
  if(e.target.classList.contains('nl'))f.newLot=e.target.value;
  if(e.target.classList.contains('np'))f.newProd=e.target.value;
  tr.querySelector('.nn').textContent=newName(f);summary();
});
$('tb').addEventListener('change',e=>{
  if(e.target.classList.contains('sel')){
    files.find(x=>x.id==e.target.closest('tr').dataset.id).sel=e.target.checked}
});
$('all').onchange=e=>{files.forEach(f=>f.sel=e.target.checked);render()};
$('apply').onclick=()=>{
  const l=$('bLot').value.trim(),p=$('bProd').value.trim();
  files.filter(f=>f.sel).forEach(f=>{if(l)f.newLot=l;if(p)f.newProd=p});render();
};
$('reset').onclick=()=>{files.forEach(f=>{f.newLot=f.lot;f.newProd=f.prod});render()};

// 產生修改後的 CSV 內容
function build(f){
  let t=f.text;
  const lot=(f.newLot||f.lot).trim();
  if(lot&&lot!==f.lot)t=setField(t,'Lot ID',()=>lot);
  if(f.newProd!==f.prod)t=setField(t,'Production ID',()=>f.newProd);
  if(lot)t=setField(t,'Wafer ID',v=>lot+v.slice(7));
  return s2b(t);
}
async function makeZip(list){
  const z=new JSZip(),used=new Set();
  for(const f of list){
    let n=newName(f),i=1;
    while(used.has(n)){n=n.replace(/(\.csv)?$/i,'_'+(i++)+'$1')}
    used.add(n);z.file(n,build(f));
  }
  return z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
}
function save(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
$('dlEach').onclick=async()=>{
  const g=groups();let i=0;
  for(const [k,v] of g){log('打包中 '+(++i)+'/'+g.size+'：'+k+'.zip');save(await makeZip(v),k+'.zip');await wait(500)}
  log('完成，共下載 '+g.size+' 個 zip（若瀏覽器詢問，請允許多檔下載）');
};
$('dlOne').onclick=async()=>{
  const g=groups(),all=new JSZip();
  for(const [k,v] of g){log('打包中：'+k+'.zip');all.file(k+'.zip',await makeZip(v))}
  save(await all.generateAsync({type:'blob'}),'lot_packages.zip');log('完成：lot_packages.zip');
};

// 匯入
$('drop').onclick=()=>$('fi').click();
$('fi').onchange=e=>{ingest([...e.target.files]);e.target.value=''};
['dragover','dragenter'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('over')}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('over')}));
$('drop').addEventListener('drop',e=>ingest([...e.dataTransfer.files]));
</script>
</body>
</html>
